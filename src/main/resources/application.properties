# server integration settings
server.port=8081
# local sql database settings
spring.datasource.url=jdbc:h2:file:./campuscrew_db;AUTO_SERVER=TRUE
spring.datasource.username=sa
#local password save
spring.datasource.password=password
spring.datasource.driver-class-name=org.h2.Driver
# hibernation settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# thymeleaf settings
spring.thymeleaf.cache=false
# google oauth2 settings
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:your-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_SECRET:your-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email

# file upload limits for security
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# admin credentials
app.admin.email=${ADMIN_EMAIL:admin316@campuscrew.com}
app.admin.password=${ADMIN_PASSWORD:admin@316}